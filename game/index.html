<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Velvet Vault — a top-down heist game</title>
<style>
  html, body { margin: 0; padding: 0; background: #0a0a12; height: 100%; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; color: #d8c98a;
    min-height: 100vh;
  }
  h1 {
    margin: 0 0 10px 0; font-size: 26px; letter-spacing: 6px; font-weight: 300;
    text-transform: uppercase; color: #e8d27a;
  }
  h1 b { font-weight: 700; color: #f5e6a8; }
  #wrap { position: relative; line-height: 0; }
  canvas {
    width: min(1280px, 96vw); height: auto; display: block;
    background: #14141f; border: 1px solid #3a3220; border-radius: 6px;
    box-shadow: 0 0 60px rgba(0,0,0,.8), 0 0 24px rgba(232,210,122,.08);
    cursor: crosshair;
  }
  #help {
    margin-top: 10px; font-size: 13px; color: #8d8570; letter-spacing: .4px;
    text-align: center; line-height: 1.7;
  }
  #help kbd {
    background: #1d1d2b; border: 1px solid #44405a; border-bottom-width: 2px;
    border-radius: 4px; padding: 1px 7px; font-family: inherit; color: #e8d27a; font-size: 12px;
  }
</style>
</head>
<body>
<h1><b>Velvet</b> Vault</h1>
<div id="wrap"><canvas id="game" width="1280" height="720"></canvas></div>
<noscript><p style="color:#e8d27a">Velvet Vault needs JavaScript to run.</p></noscript>
<div id="help">
  <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / arrows — move &nbsp;·&nbsp;
  <kbd>Shift</kbd> — sneak &nbsp;·&nbsp;
  hold <kbd>E</kbd> — pick locks / hack / grab loot &nbsp;·&nbsp;
  <kbd>P</kbd> — pause &nbsp;·&nbsp; <kbd>M</kbd> — mute &nbsp;·&nbsp; mouse — menus
  <br>Stay out of the yellow cones. Cameras raise the alarm. Grab the loot, then slip out the exit.
</div>
<script src="src/levels.js"></script>
<script src="src/audio.js"></script>
<script src="src/engine.js"></script>
<script src="src/render.js"></script>
<script src="src/main.js"></script>
</body>
</html>
